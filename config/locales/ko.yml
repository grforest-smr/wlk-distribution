    tip2: '자동 분배를 위해 설정에서 부대 유형을 비워두세요("자동" 선택)'
    tip3: '"대장 희망"으로 표시된 플레이어는 대장 선택 시 우선권을 받습니다'
    tip4: '분배 후 페이지 하단의 별도 블록에서 미배치 플레이어를 확인할 수 있습니다'
    
